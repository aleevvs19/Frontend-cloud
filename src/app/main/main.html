<div class="layout-container">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="logo-icon">🥖☕</span>
      <h2>PEDIDOS 360</h2>
    </div>

    <nav class="sidebar-nav">
      <ul>
        <li>
          <a routerLink="/main/dashboard" routerLinkActive="active">
            <span class="icon">📊</span>
            <span>Dashboard</span>
          </a>
        </li>
        <li>
          <a routerLink="/main/pedidos" routerLinkActive="active">
            <span class="icon">📦</span>
            <span>Pedidos</span>
          </a>
        </li>
        <li>
          <a routerLink="/main/sucursales" routerLinkActive="active">
            <span class="icon">🏪</span>
            <span>Sucursales</span>
          </a>
        </li>
        <li>
          <a routerLink="/main/inventario" routerLinkActive="active">
            <span class="icon">🍞</span>
            <span>Inventario</span>
          </a>
        </li>
        <li>
          <a routerLink="/main/reportes" routerLinkActive="active">
            <span class="icon">📈</span>
            <span>Reportes</span>
          </a>
        </li>
      </ul>
    </nav>

    <div class="sidebar-footer">
      <button class="btn-logout" (click)="logout()">
        <span class="icon">🚪</span>
        <span>Cerrar Sesión</span>
      </button>
    </div>
  </aside>

  <!-- Contenido Principal -->
  <div class="main-wrapper">
    <header class="topbar">
      <div class="system-status">
        <span class="status-badge">🟢 Red Activa • 20 Sucursales</span>
      </div>
      <div class="user-profile">
        <div class="avatar">{{ userName.charAt(0).toUpperCase() }}</div>
        <div class="user-info">
          <span class="user-name">{{ userName }}</span>
          <span class="user-email">{{ userEmail }}</span>
        </div>
      </div>
    </header>

    <main class="content-body">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
