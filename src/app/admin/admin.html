<div class="section-block" style="padding: 20px;">
  <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <div>
      <h2>Panel de Administración ⚙️</h2>
      <p style="color: #6b7280;">Gestión de productos, inventario y sucursales de la red</p>
    </div>
    <!-- BOTÓN DE NUEVO PRODUCTO CONECTADO -->
    <button (click)="nuevoProducto()" style="background: #1f2937; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer;">+ Nuevo Producto</button>
  </div>

  <div style="background: white; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); overflow: hidden; border: 1px solid #f3f4f6;">
    <table style="width: 100%; border-collapse: collapse; text-align: left;">
      <thead>
        <tr style="background: #f8fafc; border-bottom: 1px solid #e5e7eb; color: #4b5563; font-size: 0.85rem;">
          <th style="padding: 16px;">ID</th>
          <th style="padding: 16px;">Producto</th>
          <th style="padding: 16px;">Precio</th>
          <th style="padding: 16px;">Stock</th>
          <th style="padding: 16px;">Estado</th>
          <th style="padding: 16px; text-align: right;">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let p of productosAdmin" style="border-bottom: 1px solid #f3f4f6; color: #1f2937; font-size: 0.95rem;">
          <td style="padding: 16px; color: #6b7280;">#{{ p.id }}</td>
          <td style="padding: 16px; font-weight: 600;">{{ p.name }}</td>
          <td style="padding: 16px;">{{ p.price }}</td>
          <td style="padding: 16px;">{{ p.stock }} unidades</td>
          <td style="padding: 16px;">
            <span [style.background]="p.status === 'Activo' ? '#d1fae5' : '#fef3c7'" 
                  [style.color]="p.status === 'Activo' ? '#065f46' : '#b45309'"
                  style="padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600;">
              {{ p.status }}
            </span>
          </td>
          <td style="padding: 16px; text-align: right;">
            <!-- BOTONES DE EDITAR Y ELIMINAR CONECTADOS -->
            <button (click)="editarProducto(p)" style="background: #f3f4f6; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; color: #374151; margin-right: 6px;">Editar</button>
            <button (click)="eliminarProducto(p.id)" style="background: #fee2e2; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; color: #dc2626;">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
