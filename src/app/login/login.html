<div class="login-wrapper">
  <div class="login-card">
    <div class="brand-logo">🥖☕</div>
    <h2>PEDIDOS 360</h2>
    <p class="subtitle">ACCESO CORPORATIVO Y ASOCIACIÓN</p>

    <form (submit)="$event.preventDefault(); onLogin()">
      <div class="input-group">
        <label>Correo Electrónico (Azure AD)</label>
        <input type="email" placeholder="usuario@pedidos360.cl" required />
      </div>

      <div class="input-group">
        <label>Contraseña</label>
        <input type="password" placeholder="••••••••" required />
      </div>

      <a href="#" class="forgot-pass">¿Olvidaste tu contraseña?</a>

      <button type="submit" class="btn-primary">Ingresar al Sistema</button>
    </form>

    <div class="divider"><span>o autenticar con IdaaS</span></div>

    <div class="social-buttons">
      <button type="button" class="btn-msal" (click)="onLogin()">
        <svg width="18" height="18" viewBox="0 0 23 23" xmlns="http://www.w3.org/2000/svg">
          <path fill="#f35325" d="M1 1h10v10H1z"/>
          <path fill="#81bc06" d="M12 1h10v10H12z"/>
          <path fill="#05a6f0" d="M1 12h10v10H1z"/>
          <path fill="#ffba08" d="M12 12h10v10H12z"/>
        </svg>
        Iniciar sesión con Azure AD (MSAL)
      </button>
    </div>

    <p class="footer-text">Plataforma Unificada • Red de 20 Sucursales</p>
  </div>
</div>
