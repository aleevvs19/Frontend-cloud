<div class="pedidos-container">
  
  <!-- Cabecera Premium -->
  <div class="pedidos-header">
    <div class="header-icon">📦</div>
    <div>
      <h2>Mis Pedidos</h2>
      <p>Revisa el estado actual y el historial de tus compras recientes.</p>
    </div>
  </div>

  <!-- Mensaje de estado vacío -->
  <div *ngIf="misPedidos.length === 0" class="empty-state">
    <span class="empty-icon">🛍️</span>
    <h3>Aún no tienes pedidos</h3>
    <p>Explora nuestras sucursales y pide algo delicioso.</p>
  </div>

  <!-- Lista de Tarjetas de Pedidos -->
  <div class="pedidos-list">
    <div *ngFor="let pedido of misPedidos" class="pedido-card">
      
      <!-- Información del pedido -->
      <div class="pedido-info">
        <div class="pedido-title-row">
          <span class="pedido-id">Pedido {{ pedido.id }}</span>
          <span class="badge" 
                [style.background]="pedido.colorEstado" 
                [style.color]="pedido.textoEstado">
            {{ pedido.estado }}
          </span>
        </div>
        
        <p class="pedido-date">📅 Realizado el {{ pedido.fecha }}</p>
        
        <!-- Lista de items con diseño de "etiquetas" -->
        <div class="pedido-items">
          <div class="item-row" *ngFor="let item of pedido.items">
            <span class="item-dot"></span>
            <span class="item-text">{{ item }}</span>
          </div>
        </div>
      </div>

      <!-- Sección del total y acción -->
      <div class="pedido-action">
        <div>
          <div class="total-label">Total pagado</div>
          <div class="total-amount">{{ pedido.total }}</div>
        </div>
        <button class="btn-boleta" (click)="verDetalle(pedido.id)">
          📄 Ver boleta
        </button>
      </div>

    </div>
  </div>

</div>
